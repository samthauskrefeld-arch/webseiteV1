name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myminijob
          POSTGRES_PASSWORD: myminijob
          POSTGRES_DB: myminijob
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U myminijob" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://myminijob:myminijob@localhost:5432/myminijob
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Schema drift check (schema.prisma vs. migrations)
        run: pnpm --filter @myminijob/db check-drift
      - run: pnpm db:seed
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit & integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @myminijob/web exec playwright install --with-deps chromium
      - name: E2E (journey, a11y, mobile)
        run: pnpm test:e2e
      - name: Restore test
        run: ./scripts/restore-test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
